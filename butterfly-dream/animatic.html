<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栩栩 · 粒子动态分镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#08080a; --panel:#131316; --line:#26262b; --text:#e8e6e1; --muted:#8f8d88; --bi:#19c3b0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
  #app{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
  header h1{font-size:22px;font-weight:700;letter-spacing:.3em}
  header .sub{color:var(--muted);font-size:13px;letter-spacing:.05em}
  #stageWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #1c1c20,0 20px 60px rgba(0,0,0,.6)}
  #stage{display:block;width:100%;height:100%}
  #bigPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 30px;background:rgba(10,10,12,.62);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:999px;font:inherit;font-size:16px;letter-spacing:.14em;cursor:pointer;backdrop-filter:blur(6px);transition:border-color .2s,box-shadow .2s}
  #bigPlay:hover{border-color:var(--bi);box-shadow:0 0 24px rgba(25,195,176,.35)}
  #bigPlay small{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:4px}
  #controls{display:flex;align-items:flex-start;gap:10px;margin-top:12px}
  .ctl{height:34px;min-width:40px;padding:0 10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;cursor:pointer;font:inherit;font-size:14px}
  .ctl:hover{border-color:#55555a}
  #tc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);white-space:nowrap;line-height:34px}
  #tlwrap{flex:1;min-width:0}
  #timeline{position:relative;height:34px;cursor:pointer;touch-action:none}
  #segs{position:absolute;left:0;right:0;top:9px;bottom:9px;display:flex;gap:1px;border-radius:3px;overflow:hidden}
  .seg{height:100%;opacity:.8}
  .seg.on{opacity:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}
  #playhead{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:#fff;border-radius:1px;pointer-events:none;box-shadow:0 0 8px rgba(255,255,255,.8)}
  #acts{position:relative;height:16px;margin-top:2px;font-size:11px;color:var(--muted)}
  #acts > span{position:absolute;white-space:nowrap}
  #acts .short{display:none}
  #info{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:14px 22px}
  #info .id{font-size:30px;font-weight:700;letter-spacing:.06em}
  #info .title{font-size:18px;margin-top:2px}
  #info .time{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);margin-top:8px}
  #info .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .chip.world{color:var(--text)}
  #info dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.75}
  #info dt{color:var(--muted);font-size:12px;padding-top:4px;letter-spacing:.1em}
  #info dd.rhyme{color:var(--bi)}
  footer{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.8}
  footer kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
  @media (max-width:640px){
    #info{grid-template-columns:1fr}
    #tc{font-size:11px}
    header h1{font-size:19px}
    #acts .full{display:none}
    #acts .short{display:inline}
    #acts > span.minor{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>栩栩</h1>
    <span class="sub">Whose Dream · 粒子动态分镜（节奏 / 画幅 / 色彩 / 声音 预览）</span>
  </header>

  <div id="stageWrap">
    <canvas id="stage" aria-label="动态分镜画面"></canvas>
    <button id="bigPlay"><span id="bigLabel">加载中…</span><small id="bigSub">建议打开声音 · 约 3 分钟</small></button>
  </div>

  <div id="controls">
    <button class="ctl" id="playBtn" title="播放 / 暂停（空格）">▶</button>
    <button class="ctl" id="muteBtn" title="声音开关">♪ 开</button>
    <div id="tlwrap">
      <div id="timeline"><div id="segs"></div><div id="playhead"></div></div>
      <div id="acts"></div>
    </div>
    <span id="tc">0:00.0 / 3:00</span>
  </div>

  <section id="info">
    <div>
      <div class="id" id="iId">S01</div>
      <div class="title" id="iTitle"></div>
      <div class="time" id="iTime"></div>
      <div class="chips"><span class="chip world" id="iWorld"></span><span class="chip" id="iAct"></span><span class="chip" id="iRatio"></span></div>
    </div>
    <dl>
      <dt>画面</dt><dd id="iPic"></dd>
      <dt>镜头</dt><dd id="iCam"></dd>
      <dt>声音</dt><dd id="iSnd"></dd>
      <dt id="iRhymeT">韵脚</dt><dd class="rhyme" id="iRhyme"></dd>
    </dl>
  </section>

  <footer>
    操作：<kbd>空格</kbd> 播放 / 暂停　<kbd>←</kbd><kbd>→</kbd> 快退 / 快进 5 秒　点击或拖动时间轴跳转。<br>
    全片由数万个 WebGL 粒子实时渲染（辉光、景深光斑、胶片颗粒），声音由 Web Audio 实时合成；需要支持 WebGL2 的浏览器。完整设计见同目录 README.md。
  </footer>
</div>
<script src="js/engine.js"></script>
<script src="js/shapes.js"></script>
<script src="js/scenes1.js"></script>
<script src="js/scenes2.js"></script>
<script src="js/scenes3.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
