<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栩栩 · 动态分镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0d; --panel:#151517; --line:#29292c; --text:#e8e6e1; --muted:#8f8d88; --bi:#19c3b0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
  #app{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
  header h1{font-size:22px;font-weight:700;letter-spacing:.3em}
  header .sub{color:var(--muted);font-size:13px;letter-spacing:.05em}
  #stageWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
  #stage{display:block;width:100%;height:100%}
  #bigPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 28px;background:rgba(15,15,16,.78);color:var(--text);border:1px solid #4a4a4e;border-radius:999px;font:inherit;font-size:16px;letter-spacing:.12em;cursor:pointer;backdrop-filter:blur(4px)}
  #bigPlay:hover{border-color:var(--bi)}
  #bigPlay small{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-top:4px}
  #controls{display:flex;align-items:flex-start;gap:10px;margin-top:12px}
  #controls .ctl,#tc{margin-top:0}
  #tc{line-height:34px}
  #tlwrap{flex:1;min-width:0}
  .ctl{height:34px;min-width:40px;padding:0 10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;cursor:pointer;font:inherit;font-size:14px}
  .ctl:hover{border-color:#55555a}
  #tc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);white-space:nowrap}
  #timeline{position:relative;height:34px;cursor:pointer;touch-action:none}
  #segs{position:absolute;left:0;right:0;top:9px;bottom:9px;display:flex;gap:1px;border-radius:3px;overflow:hidden}
  .seg{height:100%;opacity:.85}
  .seg.on{opacity:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
  #playhead{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:#fff;border-radius:1px;pointer-events:none}
  #acts{position:relative;height:16px;margin-top:2px;font-size:11px;color:var(--muted)}
  #acts > span{position:absolute;white-space:nowrap}
  #acts .short{display:none}
  #info{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:14px 22px}
  #info .left .id{font-size:30px;font-weight:700;letter-spacing:.06em}
  #info .left .title{font-size:18px;margin-top:2px}
  #info .left .time{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);margin-top:8px}
  #info .left .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .chip.world{color:var(--text)}
  #info dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.75}
  #info dt{color:var(--muted);font-size:12px;padding-top:4px;letter-spacing:.1em}
  #info dd{color:var(--text)}
  #info dd.rhyme{color:var(--bi)}
  footer{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.8}
  footer kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
  @media (max-width:640px){
    #info{grid-template-columns:1fr}
    #tc{font-size:11px}
    header h1{font-size:19px}
    #acts .full{display:none}
    #acts .short{display:inline}
    #acts > span.minor{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>栩栩</h1>
    <span class="sub">Whose Dream · 动画短片动态分镜（节奏 / 画幅 / 色彩 / 声音 预览）</span>
  </header>

  <div id="stageWrap">
    <canvas id="stage" aria-label="动态分镜画面"></canvas>
    <button id="bigPlay">▶ 播放<small>建议打开声音 · 约 3 分钟</small></button>
  </div>

  <div id="controls">
    <button class="ctl" id="playBtn" title="播放 / 暂停（空格）">▶</button>
    <button class="ctl" id="muteBtn" title="声音开关">♪ 开</button>
    <div id="tlwrap">
      <div id="timeline"><div id="segs"></div><div id="playhead"></div></div>
      <div id="acts"></div>
    </div>
    <span id="tc">0:00.0 / 3:00</span>
  </div>

  <section id="info">
    <div class="left">
      <div class="id" id="iId">S01</div>
      <div class="title" id="iTitle"></div>
      <div class="time" id="iTime"></div>
      <div class="chips"><span class="chip world" id="iWorld"></span><span class="chip" id="iAct"></span><span class="chip" id="iRatio"></span></div>
    </div>
    <dl>
      <dt>画面</dt><dd id="iPic"></dd>
      <dt>镜头</dt><dd id="iCam"></dd>
      <dt>声音</dt><dd id="iSnd"></dd>
      <dt id="iRhymeT">韵脚</dt><dd class="rhyme" id="iRhyme"></dd>
    </dl>
  </section>

  <footer>
    操作：<kbd>空格</kbd> 播放 / 暂停　<kbd>←</kbd><kbd>→</kbd> 快退 / 快进 5 秒　点击或拖动时间轴跳转。<br>
    画面为程序化绘制的占位动画，声音为 Web Audio 实时合成，仅用于验证节奏与结构；完整设计见同目录 README.md。
  </footer>
</div>

<script>
(() => {
'use strict';
/* ============================================================
   基础
   ============================================================ */
const W = 1280, H = 720, TOTAL = 180, TAU = Math.PI * 2;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let S = 1;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry(1);
const seed = s => { R = mulberry(s | 0); };
const rj = a => (R() * 2 - 1) * a;
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t)), g = Math.round(lerp(pa >> 8 & 255, pb >> 8 & 255, t)), bl = Math.round(lerp(pa & 255, pb & 255, t));
  return `rgb(${r},${g},${bl})`;
}
function fillRect(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }

/* ============================================================
   2D 黑白工具
   ============================================================ */
const INK = '#141414', DARK = '#262625', MID = '#4d4d4b', GREY = '#7c7b77', LIGHT = '#b9b7b1', PAPER = '#e7e5df';

function jl(x1, y1, x2, y2, lw = 2, c = INK, a = 1.3) {
  ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1 + rj(a), y1 + rj(a));
  ctx.quadraticCurveTo((x1 + x2) / 2 + rj(a * 1.5), (y1 + y2) / 2 + rj(a * 1.5), x2 + rj(a), y2 + rj(a));
  ctx.stroke();

function jrect(x, y, w, h, lw = 2, c = INK, fill = null) {
  if (fill) fillRect(fill, x, y, w, h);
  jl(x, y, x + w, y, lw, c); jl(x + w, y, x + w, y + h, lw, c); jl(x + w, y + h, x, y + h, lw, c); jl(x, y + h, x, y, lw, c);
}
function rain(t, o = {}) {
  const n = o.n || 160, a = o.a ?? .5, ang = o.ang ?? .22, len = o.len || 70, sp = o.sp || 1100;
  const x0 = o.x0 ?? 0, x1 = o.x1 ?? W, y0 = o.y0 ?? 0, y1 = o.y1 ?? H, c = o.c || '235,235,230';
  const r = mulberry(o.seed || 77);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
  ctx.strokeStyle = `rgba(${c},${a})`; ctx.lineWidth = o.lw || 1.3; ctx.beginPath();
  const hh = y1 - y0 + len;
  for (let i = 0; i < n; i++) {
    const bx = x0 - 100 + r() * (x1 - x0 + 300 + (y1 - y0) * ang), by = r() * hh, s = sp * (.75 + r() * .5);
    const y = y0 - len + ((by + t * s) % hh);
    const x = bx - (y - y0) * ang;
    ctx.moveTo(x, y); ctx.lineTo(x - len * ang, y + len);
  }
  ctx.stroke(); ctx.restore();
}
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 256;
{
  const g = grainC.getContext('2d'), im = g.createImageData(256, 256), r = mulberry(9);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = r() * 60; }
  g.putImageData(im, 0, 0);
}
let grainPat = null;
function grain(al = .55) {
  if (!grainPat) grainPat = ctx.createPattern(grainC, 'repeat');
  ctx.save(); ctx.globalAlpha = al; ctx.translate(Math.floor(R() * 256), Math.floor(R() * 256));
  ctx.fillStyle = grainPat; ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
}
function vignette(a = .55, c = '0,0,0') {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(1, `rgba(${c},${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function person(x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = o.body || DARK;
  ctx.beginPath(); ctx.moveTo(-20, -100); ctx.lineTo(20, -100); ctx.lineTo(17, 0); ctx.lineTo(4, 0); ctx.lineTo(0, -55); ctx.lineTo(-4, 0); ctx.lineTo(-17, 0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, -168); ctx.quadraticCurveTo(0, -178, 30, -168); ctx.lineTo(27, -95); ctx.lineTo(-27, -95); ctx.closePath(); ctx.fill();
  if (o.tie) {
    ctx.fillStyle = PAPER; ctx.beginPath(); ctx.moveTo(-9, -171); ctx.lineTo(9, -171); ctx.lineTo(0, -140); ctx.closePath(); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(-3, -167); ctx.lineTo(3, -167); ctx.lineTo(4, -128); ctx.lineTo(0, -122); ctx.lineTo(-4, -128); ctx.closePath(); ctx.fill();
  }
  const hy = o.hy || 0;
  ctx.fillStyle = o.face || LIGHT; ell(0, -192 + hy, 15, 19); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, -202 + hy, 15.5, 10, 0, Math.PI, TAU); ctx.fill();
  if (o.eyes) { ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-8, -191 + hy); ctx.lineTo(-3, -191 + hy); ctx.moveTo(3, -191 + hy); ctx.lineTo(8, -191 + hy); ctx.stroke(); }
  if (o.closed) { ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(-5.5, -193 + hy, 3, .2, Math.PI - .2); ctx.moveTo(8.5, -193 + hy); ctx.arc(5.5, -193 + hy, 3, .2, Math.PI - .2); ctx.stroke(); }
  ctx.restore();
}
function umbTop(x, y, r, c = INK, rib = 'rgba(255,255,255,.16)') {
  ctx.fillStyle = c; ctx.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * TAU / 8 + TAU / 16; const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rib; ctx.lineWidth = 1.4; ctx.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * TAU / 8 + TAU / 16; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.stroke(); ctx.fillStyle = rib; circle(x, y, 2.5); ctx.fill();
}
function umbSide(x, y, r, c = INK) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x - r, y);
  ctx.quadraticCurveTo(x - r * .95, y - r * .8, x, y - r * .78); ctx.quadraticCurveTo(x + r * .95, y - r * .8, x + r, y);
  for (let k = 0; k < 4; k++) { const xa = x + r - k * r / 2, xb = xa - r / 2; ctx.quadraticCurveTo((xa + xb) / 2, y - r * .14, xb, y); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, y - r * .78); ctx.lineTo(x, y + r * .95); ctx.stroke();
}

/* ============================================================
   蝴蝶（碧凤蝶）
   ============================================================ */
const WP = (() => {
  const fw = new Path2D(); fw.moveTo(2, -4); fw.bezierCurveTo(12, -28, 32, -46, 50, -42); fw.bezierCurveTo(54, -32, 48, -14, 40, -3); fw.bezierCurveTo(28, 1, 14, 2, 2, 1); fw.closePath();
  const hw = new Path2D(); hw.moveTo(2, 1); hw.bezierCurveTo(18, 0, 36, 6, 39, 17); hw.bezierCurveTo(40, 27, 31, 33, 25, 35); hw.lineTo(24, 50); hw.quadraticCurveTo(21, 53, 19, 49); hw.lineTo(19, 37); hw.bezierCurveTo(12, 35, 4, 26, 2, 9); hw.closePath();
  return { fw, hw };
})();
function wing(p, hind, o) {
  const gray = o.gray, fade = o.fade || 0, ph = o.ph || 0, hue = o.hue || 0;
  ctx.fillStyle = gray ? '#2c2c2b' : '#0d1313'; ctx.fill(p);
  ctx.save(); ctx.clip(p);
  let c1, c2;
  if (gray) { c1 = 'rgba(165,165,160,.85)'; c2 = 'rgba(120,120,116,.45)'; }
  else {
    const sat = Math.round(88 * (1 - fade)), h1 = 168 + hue + 16 * Math.sin(ph * 1.3), h2 = 208 + hue + 18 * Math.sin(ph * 1.3 + 1.2);
    c1 = `hsla(${h1},${sat}%,${Math.round(50 + 10 * (1 - fade))}%,.95)`; c2 = `hsla(${h2},${sat}%,44%,.55)`;
  }
  const g = hind ? ctx.createRadialGradient(14, 12, 1, 16, 14, 28) : ctx.createRadialGradient(20, -16, 1, 22, -18, 30);
  g.addColorStop(0, c1); g.addColorStop(.55, c2); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-2, -56, 64, 112);
  ctx.fillStyle = gray ? 'rgba(190,190,185,.5)' : `hsla(${150 + hue},${Math.round(60 * (1 - fade))}%,66%,.6)`;
  if (hind) {
    for (const [a, b] of [[35, 20], [31, 27], [25, 31], [37, 13]]) { circle(a, b, 1.6); ctx.fill(); }
    ctx.fillStyle = gray ? '#9a9a95' : `hsla(354,${Math.round(78 * (1 - fade))}%,52%,1)`; circle(29, 30, 3.4); ctx.fill();
    ctx.strokeStyle = gray ? '#5a5a57' : `hsla(225,${Math.round(70 * (1 - fade))}%,62%,.9)`; ctx.lineWidth = 1.2; ctx.stroke();
  } else {
    for (const [a, b] of [[46, -36], [48, -28], [46, -20], [43, -12]]) { circle(a, b, 1.4); ctx.fill(); }
  }
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = .7; ctx.beginPath();
  if (hind) for (const [a, b] of [[37, 12], [33, 24], [25, 33], [14, 30], [6, 22]]) { ctx.moveTo(3, 2); ctx.lineTo(a, b); }
  else for (const [a, b] of [[48, -40], [50, -30], [46, -18], [40, -6], [30, -1]]) { ctx.moveTo(3, -2); ctx.lineTo(a, b); }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 1; ctx.stroke(p);
}
/* 背面俯视：s = 翼展像素；open 1 = 全展开，→0 = 合拢 */
function bfly(x, y, s, o = {}) {
  const open = clamp(o.open ?? 1, .03, 1), crumple = o.crumple || 0;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(s / 100, s / 100);
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.scale(side * open, 1 - .32 * crumple);
    if (o.tatter) {
      ctx.beginPath(); ctx.rect(-5, -70, 80, 140);
      const N = side > 0 ? [[51, -40, 6], [44, -12, 5], [37, 18, 5], [25, 47, 4]] : [[47, -30, 5], [40, -4, 4], [32, 32, 6]];
      for (const [a, b, r] of N) { ctx.moveTo(a + r, b); ctx.arc(a, b, r, 0, TAU); }
      ctx.clip('evenodd');
    }
    wing(WP.hw, 1, o); wing(WP.fw, 0, o);
    if (crumple > .05) {
      ctx.strokeStyle = `rgba(0,0,0,${.55 * crumple})`; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < 6; i++) { ctx.moveTo(6 + i * 7, -32 + i * 4); ctx.lineTo(13 + i * 6, 14 - i * 3); }
      ctx.stroke();
    }
    ctx.restore();
  }
  const bc = o.gray ? '#1e1e1e' : '#121212';
  ctx.fillStyle = bc; ell(0, 6, 3.4, 21); ctx.fill(); circle(0, -16, 4.2); ctx.fill();
  ctx.strokeStyle = bc; ctx.lineWidth = 1.3; ctx.beginPath();
  ctx.moveTo(-1.5, -19); ctx.quadraticCurveTo(-6, -32, -12, -41); ctx.moveTo(1.5, -19); ctx.quadraticCurveTo(6, -32, 12, -41); ctx.stroke();
  circle(-12, -41, 1.9); ctx.fill(); circle(12, -41, 1.9); ctx.fill();
  ctx.restore();
}
/* 侧面合翅：露出灰褐的翅背面；头朝右 */
const SWP = (() => {
  const fw = new Path2D(); fw.moveTo(-4, -2); fw.bezierCurveTo(-10, -26, -2, -50, 12, -58); fw.bezierCurveTo(24, -48, 24, -22, 14, -2); fw.closePath();
  const hw = new Path2D(); hw.moveTo(0, -2); hw.bezierCurveTo(-4, -22, -20, -38, -30, -31); hw.bezierCurveTo(-38, -22, -35, -8, -27, -3); hw.lineTo(-40, 5); hw.lineTo(-36, 9); hw.lineTo(-22, 2); hw.closePath();
  return { fw, hw };
})();
function bflySide(x, y, s, o = {}) {
  const fade = o.fade || 0, gray = o.gray;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale((o.flip ? -1 : 1) * s / 100, s / 100);
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.tatter) {
    ctx.beginPath(); ctx.rect(-100, -100, 200, 200);
    for (const [a, b, r] of [[13, -58, 5], [22, -30, 4], [-34, -26, 5], [-40, 5, 3]]) { ctx.moveTo(a + r, b); ctx.arc(a, b, r, 0, TAU); }
    ctx.clip('evenodd');
  }
  ctx.fillStyle = gray ? '#5f5e5a' : mixHex('#76675a', '#8c8782', fade);
  ctx.fill(SWP.hw); ctx.fill(SWP.fw);
  ctx.save(); ctx.clip(SWP.fw);
  ctx.fillStyle = gray ? 'rgba(200,200,195,.25)' : `rgba(222,206,160,${.4 * (1 - fade)})`; ell(9, -30, 6, 26, .2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.clip(SWP.hw);
  ctx.fillStyle = gray ? '#8a8a86' : `rgba(206,82,60,${.85 * (1 - fade)})`;
  for (let i = 0; i < 4; i++) { circle(-31 + i * 6, -9 + i * 2.5, 2.2); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(30,25,20,.7)'; ctx.lineWidth = 1; ctx.stroke(SWP.fw); ctx.stroke(SWP.hw);
  ctx.strokeStyle = 'rgba(30,25,20,.35)'; ctx.lineWidth = .7; ctx.beginPath();
  for (const [a, b] of [[10, -54], [16, -40], [18, -22]]) { ctx.moveTo(0, -2); ctx.lineTo(a, b); }
  for (const [a, b] of [[-26, -30], [-32, -18], [-30, -6]]) { ctx.moveTo(-2, -2); ctx.lineTo(a, b); }

  { const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true; const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000; rainG = AC.createGain(); rainG.gain.value = 0; s.connect(hp).connect(lp).connect(rainG).connect(master); s.start(); }

const PLK = {};

function rainLevel(t) {
  if (t < 50) return .3 * ss(0, 2, t);
  if (t < 60) return .3 * (1 - ss(50, 58, t));
  if (t >= 91 && t < 98 && inFlash(t - 91) >= 0) return .5;
  if (t < 108) return 0;
  if (t < 116) return .14;
  if (t < 136) return 0;
  if (t < 140) return .05;
  if (t < 148) return .3;
  if (t < 155) return .42;
  if (t < 162) return .2;
  if (t < 165) return .2 * (1 - ss(163, 165, t));
  if (t > 172 && t < 178) return .08;
  return 0;
}
function windLevel(t) {
  if (t < 58) return 0;
  if (t < 98) return .3 * ss(58, 62, t);
  if (t < 107.2) return .3 + ss(98, 107, t) * .5;
  if (t < 108) return 0;
  if (t < 116) return .2;
  if (t < 128) return .25 * (1 - ss(124, 128, t));
  if (t >= 155 && t < 162) return .18;
  return 0;
}

  windG.gain.setTargetAtTime(windLevel(t) * on, now, .15);

let T = 0, playing = false, last = null, dirty = true, curShot = null;
const $ = id => document.getElementById(id);

const fmt0 = t => { const m = Math.floor(t / 60), s = Math.round(t - m * 60); return `${m}:${s < 10 ? '0' : ''}${s}`; };
const segsEl = $('segs'), actsEl = $('acts');

const SHORT = { '第一幕「雨」': '雨', '入梦': '梦', '第二幕「晴」': '晴', '第三幕「交织」': '交织', '尾声「觉」': '觉', '片尾': '尾' };
{ let prev = ''; for (const s of SHOTS) if (s.act !== prev) { prev = s.act; const sp = document.createElement('span'); sp.innerHTML = `<span class="full">${s.act}</span><span class="short">${SHORT[s.act] || s.act}</span>`; sp.style.left = (s.t0 / TOTAL * 100) + '%'; if (['序', '入梦', '片尾'].includes(s.act)) sp.className = 'minor'; actsEl.appendChild(sp); } }
function setPlaying(p) {

  const dt = last == null ? 0 : Math.min(.1, (ts - last) / 1000); last = ts;
  if (playing) {
    T += dt;

const tl = $('timeline');
